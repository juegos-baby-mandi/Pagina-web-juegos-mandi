<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cotización | Juegos Baby Mandi</title>

    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="cotizacion.css">

    <!-- Estilos pagina -->
    
    <style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.contenedor-cotizacion{
    max-width:900px;
    margin:auto;
}

.resumen,
.datos{
    background:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.producto-cotizacion{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #e5e5e5;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.btn-cotizar{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:#ff7a00;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.btn-cotizar:hover{
    background:#e56d00;
}

#subtotal,
#valor-traslado,
#total-final{
    text-align:right;
    font-size:20px;
    margin-top:15px;
}

    </style>
    
</head>

<body>

<header>
    <!-- Aquí después pondremos el mismo menú de tu página -->
</header>

<main class="contenedor-cotizacion">

    <h1>📄 Crear Cotización</h1>

    <p class="intro">
        Completa tus datos y recibirás una cotización profesional en tu correo.
        La disponibilidad será confirmada posteriormente por WhatsApp.
    </p>

    <section class="resumen">
        <h2>🛒 Resumen de tu cotización</h2>

        <div id="resumen-carrito"></div>

        <div id="subtotal"></div>

        <div id="valor-traslado"></div>

        <div id="total-final"></div>
    </section>

    <section class="datos">

        <h2>Datos del cliente</h2>

        <form id="form-cotizacion">

            <h2>Datos del solicitante</h2>

<label>¿Quién solicita la cotización?</label>

<select id="tipoSolicitante" required>

    <option value="">Seleccione una opción</option>

    <option value="Particular">👤 Particular</option>

    <option value="Empresa">🏢 Empresa</option>

    <option value="Productora">🎪 Productora</option>

    <option value="Municipalidad">🏛️ Municipalidad</option>

    <option value="Colegio">🏫 Colegio o Jardín</option>

    <option value="Otro">🎉 Otro</option>

</select>

<div id="campoOrganizacion"></div>

<label>Nombre del contacto</label>
<input type="text" id="nombre" required>

<label>Teléfono</label>
<input type="tel" id="telefono" required>

<label>Correo electrónico</label>
<input type="email" id="correo" required>

<label>Cantidad aproximada de asistentes</label>

<input
type="number"
id="asistentes"
min="1"
placeholder="Ej: 80 personas"
required>

            <label>Tipo de actividad</label>
            <select id="actividad">
                <option>Cumpleaños</option>
                <option>Matrimonio</option>
                <option>Empresa</option>
                <option>Colegio</option>
                <option>Municipalidad</option>
                <option>Evento Particular</option>
                <option>Otro</option>
            </select>

            <label>Fecha del evento</label>
            <input type="date" id="fecha" required>

            <label>Comuna</label>
            <select id="comuna" required></select>

            <label>Dirección del evento</label>
            <input type="text" id="direccion" required>

            <button type="submit" class="btn-cotizar">
                📄 Generar Cotización
            </button>

        </form>

    </section>

</main>

<script>

const carrito = JSON.parse(localStorage.getItem("carrito")) || [];

const resumen = document.getElementById("resumen-carrito");
const subtotalDiv = document.getElementById("subtotal");

let subtotal = 0;

if (carrito.length === 0) {

    resumen.innerHTML = `
        <p style="text-align:center;">
            No hay productos en el carrito.
        </p>
    `;

} else {

    carrito.forEach(item => {

        const fila = document.createElement("div");

        fila.style.display = "flex";
        fila.style.justifyContent = "space-between";
        fila.style.padding = "10px";
        fila.style.borderBottom = "1px solid #ddd";

        fila.innerHTML = `
            <span>${item.nombre}</span>
            <strong>$${item.precio.toLocaleString("es-CL")}</strong>
        `;

        resumen.appendChild(fila);

        subtotal += item.precio;

    });

}

subtotalDiv.innerHTML = `
    <h3 style="text-align:right;">
        Subtotal: $${subtotal.toLocaleString("es-CL")}
    </h3>
`;


// ===== TRASLADOS =====

const traslados = {
    "Alhué":100000,
    "Buin":50000,
    "Calera de Tango":40000,
    "Cerrillos":10000,
    "Cerro Navia":0,
    "Colina":45000,
    "Conchalí":15000,
    "Curacaví":60000,
    "El Bosque":15000,
    "El Monte":80000,
    "Estación Central":10000,
    "Huechuraba":20000,
    "Independencia":15000,
    "Isla de Maipo":60000,
    "La Cisterna":20000,
    "La Florida":30000,
    "La Granja":25000,
    "La Pintana":35000,
    "La Reina":35000,
    "Lampa":30000,
    "Las Condes":40000,
    "Lo Barnechea":40000,
    "Lo Espejo":20000,
    "Lo Prado":0,
    "Macul":35000,
    "Maipú":10000,
    "María Pinto":80000,
    "Melipilla":100000,
    "Ñuñoa":25000,
    "Padre Hurtado":25000,
    "Paine":40000,
    "Pedro Aguirre Cerda":20000,
    "Peñaflor":35000,
    "Peñalolén":40000,
    "Pirque":40000,
    "Providencia":30000,
    "Pudahuel":0,
    "Puente Alto":40000,
    "Quilicura":15000,
    "Quinta Normal":5000,
    "Recoleta":15000,
    "Renca":5000,
    "San Bernardo":25000,
    "San Joaquín":25000,
    "San José de Maipo":80000,
    "San Miguel":25000,
    "San Pedro":150000,
    "San Ramón":25000,
    "Santiago":35000,
    "Talagante":40000,
    "Tiltil":50000,
    "Vitacura":40000
};

const comunaSelect = document.getElementById("comuna");

// Agregar opción inicial
comunaSelect.innerHTML = `<option value="">Seleccione una comuna</option>`;

// Llenar el listado automáticamente
Object.keys(traslados)
.sort()
.forEach(comuna => {

    comunaSelect.innerHTML += `
        <option value="${comuna}">
            ${comuna}
        </option>
    `;

});

    comunaSelect.addEventListener("change", actualizarTotal);

function actualizarTotal(){

    const comuna = comunaSelect.value;

    const traslado = traslados[comuna] || 0;

    document.getElementById("valor-traslado").innerHTML = `
        <h3>
            🚚 Traslado a ${comuna}: $${traslado.toLocaleString("es-CL")}
        </h3>
    `;

    const total = subtotal + traslado;

    document.getElementById("total-final").innerHTML = `
        <h2>
            Total: $${total.toLocaleString("es-CL")}
        </h2>
    `;

}


    const tipoSolicitante = document.getElementById("tipoSolicitante");

const campoOrganizacion = document.getElementById("campoOrganizacion");

tipoSolicitante.addEventListener("change", mostrarCampo);

function mostrarCampo(){

    const tipo = tipoSolicitante.value;

    let texto = "";

    switch(tipo){

        case "Empresa":
            texto = "Nombre de la empresa";
            break;

        case "Productora":
            texto = "Nombre de la productora";
            break;

        case "Municipalidad":
            texto = "Nombre de la municipalidad";
            break;

        case "Colegio":
            texto = "Nombre del colegio o jardín";
            break;

        case "Otro":
            texto = "Nombre de la organización";
            break;

        default:
            campoOrganizacion.innerHTML = "";
            return;

    }

    campoOrganizacion.innerHTML = `
        <label>${texto}</label>

        <input
            type="text"
            id="organizacion"
            required>
    `;

}

</script>

</body>
</html>
