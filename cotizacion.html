<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cotización | Juegos Baby Mandi</title>

    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="cotizacion.css">

    <!-- Estilos pagina -->
    
    <style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.contenedor-cotizacion{
    max-width:900px;
    margin:auto;
}

.resumen,
.datos{
    background:white;
    padding:25px;
    border-radius:10px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.producto-cotizacion{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #e5e5e5;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.btn-cotizar{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:#ff7a00;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.btn-cotizar:hover{
    background:#e56d00;
}

#subtotal,
#valor-traslado,
#total-final{
    text-align:right;
    font-size:20px;
    margin-top:15px;
}

    </style>
    
</head>

<body>

<header>
    <!-- Aquí después pondremos el mismo menú de tu página -->
</header>

<main class="contenedor-cotizacion">

    <h1>📄 Crear Cotización</h1>

    <p class="intro">
        Completa tus datos y recibirás una cotización profesional en tu correo.
        La disponibilidad será confirmada posteriormente por WhatsApp.
    </p>

    <section class="resumen">
        <h2>🛒 Resumen de tu cotización</h2>

        <div id="resumen-carrito"></div>

        <div id="subtotal"></div>

        <div id="valor-traslado"></div>

        <div id="total-final"></div>
    </section>

    <section class="datos">

        <h2>Datos del cliente</h2>

        <form id="form-cotizacion">

            <label>Nombre completo</label>
            <input type="text" id="nombre" required>

            <label>Teléfono</label>
            <input type="tel" id="telefono" required>

            <label>Correo electrónico</label>
            <input type="email" id="correo" required>

            <label>Tipo de actividad</label>
            <select id="actividad">
                <option>Cumpleaños</option>
                <option>Matrimonio</option>
                <option>Empresa</option>
                <option>Colegio</option>
                <option>Municipalidad</option>
                <option>Evento Particular</option>
                <option>Otro</option>
            </select>

            <label>Fecha del evento</label>
            <input type="date" id="fecha" required>

            <label>Comuna</label>
            <select id="comuna" required></select>

            <label>Dirección del evento</label>
            <input type="text" id="direccion" required>

            <button type="submit" class="btn-cotizar">
                📄 Generar Cotización
            </button>

        </form>

    </section>

</main>

<script>

const carrito = JSON.parse(localStorage.getItem("carrito")) || [];

const resumen = document.getElementById("resumen-carrito");
const subtotalDiv = document.getElementById("subtotal");

let subtotal = 0;

if (carrito.length === 0) {

    resumen.innerHTML = `
        <p style="text-align:center;">
            No hay productos en el carrito.
        </p>
    `;

} else {

    carrito.forEach(item => {

        const fila = document.createElement("div");

        fila.style.display = "flex";
        fila.style.justifyContent = "space-between";
        fila.style.padding = "10px";
        fila.style.borderBottom = "1px solid #ddd";

        fila.innerHTML = `
            <span>${item.nombre}</span>
            <strong>$${item.precio.toLocaleString("es-CL")}</strong>
        `;

        resumen.appendChild(fila);

        subtotal += item.precio;

    });

}

subtotalDiv.innerHTML = `
    <h3 style="text-align:right;">
        Subtotal: $${subtotal.toLocaleString("es-CL")}
    </h3>
`;

</script>

</body>
</html>
